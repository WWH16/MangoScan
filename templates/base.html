<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#b99466">
    <title>{% block title %}MangoScan{% endblock %}</title>
    <link rel="preload" href="{{ url_for('static', filename='fonts/permanent-marker.woff2') }}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{{ url_for('static', filename='fonts/barlow-sc-600.woff2') }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23d9bc91'/%3E%3Cpath d='M9 22c0-7 4-12 10-12 3 0 4 2 4 4 0 6-6 10-11 10-2 0-3-1-3-2z' fill='%23f2b705' stroke='%231c1814' stroke-width='2'/%3E%3C/svg%3E">
</head>
<body class="{% block body_class %}{% endblock %}">
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-bar">
        <a href="{{ url_for('index') }}" class="wordmark" aria-label="MangoScan, start a new scan">
            <svg class="wordmark-fruit" viewBox="0 0 32 32" aria-hidden="true"><path d="M7 23c0-8 5-14 12-14 3.5 0 5 2.2 5 4.6C24 20 17 25 11.5 25 8.6 25 7 24.3 7 23z"/><path class="leaf" d="M19 9c1-3 3.5-4.5 6.5-4.5-.6 3-2.8 4.8-6.5 4.5z"/></svg>
            <span>MangoScan</span>
        </a>
        {% block bar_action %}{% endblock %}
    </header>

    <main id="main" class="page">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-foot">
        <p>MangoScan &middot; thesis prototype &middot; HSV, GLCM and Hu features with an RBF SVM</p>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
